name: CI

# A change that only touches the website, its workflow, or prose nothing is
# built from cannot break the build. doc/cli.md and the agent skill are not
# here: the tests compile them in and check them against the parser.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'doc/documentation.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'doc/documentation.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'LICENSE'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets
