name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin omacharts
      - name: Name the archive after the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="omacharts-$version-x86_64-linux"
          mkdir "$dir"
          cp target/release/omacharts LICENSE README.md "$dir/"
          cp -r assets packaging "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            omacharts-*-x86_64-linux.tar.gz
            omacharts-*-x86_64-linux.tar.gz.sha256
          generate_release_notes: true

  # The version appears in three places that a tag cannot float: the README's
  # download line names the file, and the PKGBUILD carries the version and the
  # digest of the tarball GitHub builds for the tag. The digest can only be
  # taken once the tag exists, which is why this runs here rather than before.
  sync:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Write the new version into the README and the PKGBUILD
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          digest=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          test -n "$digest"

          sed -i -E "s|omacharts-[0-9]+\.[0-9]+\.[0-9]+-1-x86_64\.pkg\.tar\.zst|omacharts-${version}-1-x86_64.pkg.tar.zst|g" README.md
          sed -i -E "s|^pkgver=.*|pkgver=${version}|" packaging/aur/PKGBUILD
          sed -i -E "s|^sha256sums=.*|sha256sums=('${digest}')|" packaging/aur/PKGBUILD
          # And the crate itself, or `omacharts --version` keeps answering with
          # whatever it was built at when the version last moved by hand.
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s||version = \"${version}\"|" Cargo.toml
          # Must not be allowed to fail quietly: a lock file left behind its
          # own Cargo.toml makes every later `--locked` build refuse, which is
          # how CI came to be red on main after a release.
          cargo update -p omacharts --offline

          git diff --stat
      - name: Commit it back
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to change — the tag was cut with the version already written."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Write ${GITHUB_REF_NAME} into the README and the PKGBUILD

          Done by the release workflow: the download line names the file and
          the PKGBUILD carries the version and the tarball's digest, and none
          of the three can be floated by the tag."
          git push origin main

  # The package people actually install, built the way the PKGBUILD says and
  # attached to the release. After `sync`, so it uses the PKGBUILD carrying
  # this tag's version and digest — which also means a release that gets this
  # far has proved the PKGBUILD works against the tarball GitHub serves.
  package:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm git rust gtk4 libadwaita github-cli
          # The container is root and the checkout is not, so git refuses the
          # directory — and `gh release upload` shells out to git to work out
          # which repository it is in.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build the package
        run: |
          set -euo pipefail
          # makepkg refuses to run as root, which is all a container has.
          useradd -m builder
          cp packaging/aur/PKGBUILD /home/builder/
          chown -R builder:builder /home/builder
          su builder -c 'cd ~ && makepkg --noconfirm'
          mv /home/builder/omacharts-*-x86_64.pkg.tar.zst . 2>/dev/null || true
          ls -l omacharts-*.pkg.tar.zst
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The debug package is a by-product nobody installs.
          gh release upload "$GITHUB_REF_NAME" \
            $(ls omacharts-*-x86_64.pkg.tar.zst | grep -v -- '-debug-') --clobber
