name: Release

# A tag releases. A pull request that touches the release itself, or a run by
# hand, is a dry run: every job and every build, the same as a release, but
# nothing is written — no draft, no digest committed back, no upload, no
# publish. The assets it would have attached are kept as the run's artifacts
# instead, so a change to this file is proved, and timed, before a tag
# depends on it.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/aur/PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write

env:
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  # A draft until `publish`, at the end: releases/latest, which is what every
  # installed omacharts asks for, must never name a release whose binaries are
  # still being built. Nothing is built here: every binary that ships comes out
  # of the Arch packages below, so the app is compiled once per architecture
  # and every asset is the binary pacman would install.
  draft:
    runs-on: ubuntu-latest
    steps:
      - if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  # Everything a tag can carry is already in the tag: bin/release writes the
  # version into Cargo.toml, Cargo.lock and the PKGBUILD, and
  # verifies the tree builds with it, before tagging. The one thing that cannot
  # exist until the tag does is the digest of the tarball GitHub builds for it,
  # so that is the only thing written here.
  #
  # Deliberately no toolchain and no cargo in this job. It used to bump the
  # version too, which meant running cargo in a checkout that never builds —
  # that left the lock file behind its own Cargo.toml once and broke every
  # --locked build on main, and failed outright the next time.
  #
  # Needs nothing before it: what it writes depends only on the tag.
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Write the tarball's digest into the PKGBUILD
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          digest=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          [ -n "$digest" ] || { echo "no digest for $url"; exit 1; }

          # The tag should already name itself everywhere. If it does not,
          # something was tagged by hand instead of through bin/release.
          grep -q "^pkgver=${version}$" packaging/aur/PKGBUILD \
            || { echo "PKGBUILD pkgver is not ${version} — was this tagged with bin/release?"; exit 1; }

          sed -i -E "s|^sha256sums=.*|sha256sums=('${digest}')|" packaging/aur/PKGBUILD
          git diff --stat
      - name: Commit it back
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The digest was already correct."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Pin the ${GITHUB_REF_NAME} tarball

          Written by the release workflow: the digest of the tarball GitHub
          builds for a tag cannot be known until the tag exists."
          git push origin main

  # The package people actually install, built the way the PKGBUILD says and
  # attached to the release. After `sync`, so it uses the PKGBUILD carrying
  # this tag's version and digest — which also means a release that gets this
  # far has proved the PKGBUILD works against the tarball GitHub serves.
  #
  # Once per architecture, each on a runner of its own kind. Arch Linux itself
  # is x86_64 only; aarch64 machines — an Omarchy Mac among them — run Arch
  # Linux ARM, which publishes no container image, so its root filesystem is
  # imported from the project's own tarball instead.
  #
  # Every binary that ships is the one built here, inside Arch, against Arch's
  # own libraries: the package, the gzipped app its updater downloads, and on
  # x86_64 the plain tarball too.
  package:
    needs: [draft, sync]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: archlinuxarm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      # A dry run has no sync to wait for, so it takes the PKGBUILD it was
      # run with; the source that PKGBUILD names is still the last tag's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.sha }}
      - name: Import Arch Linux ARM's root filesystem
        if: matrix.arch == 'aarch64'
        run: |
          set -euo pipefail
          base=http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          curl -fsSL "$base" -o rootfs.tar.gz
          curl -fsSL "$base.sig" -o rootfs.tar.gz.sig
          # The tarball only travels over plain HTTP — the host's certificate
          # does not cover it — so its signature is the one thing vouching for
          # it, and the keyring pacman goes on to trust is inside it.
          gpg --keyserver hkps://keyserver.ubuntu.com \
            --recv-keys 68B3537F39A313B3E574D06777193F152BDBE6A6
          gpg --verify rootfs.tar.gz.sig rootfs.tar.gz
          docker import rootfs.tar.gz archlinuxarm
      - name: Build the package
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" bash -euo pipefail -c '
            # A fresh root filesystem has no keys to check packages against,
            # and pacman cannot drop to its download user inside a container.
            pacman-key --init
            pacman-key --populate
            sed -i "s/^DownloadUser/#DownloadUser/" /etc/pacman.conf
            pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita
            # makepkg refuses to run as root, which is all a container has.
            useradd -m builder
            cp packaging/aur/PKGBUILD /home/builder/
            chown -R builder:builder /home/builder
            # Arch Linux ARM defaults to .pkg.tar.xz; one name for every arch.
            su builder -c "cd ~ && PKGEXT=.pkg.tar.zst makepkg --noconfirm"
            # The package must start on any Arch system with its depends, so
            # nothing in it may link the OpenSSL this container happens to have.
            bin/check-links /home/builder/pkg/omacharts/usr/bin/omacharts \
              /home/builder/pkg/omacharts/usr/lib/omacharts/omacharts
            cp /home/builder/omacharts-*.pkg.tar.zst /w/
            # The source makepkg fetched and checked against the PKGBUILD,
            # for the plain tarball, below.
            cp /home/builder/omacharts-*[0-9].tar.gz /w/tag-source.tar.gz'
          ls -l omacharts-*.pkg.tar.zst
      - name: Assemble the assets
        run: |
          set -euo pipefail
          # The debug package is a by-product nobody installs.
          package=$(ls omacharts-*-${{ matrix.arch }}.pkg.tar.zst | grep -v -- '-debug-')
          # And a copy under a name with no version in it, so that
          # releases/latest/download/omacharts-<arch>.pkg.tar.zst is always
          # the newest package and the README never has to change.
          cp "$package" omacharts-${{ matrix.arch }}.pkg.tar.zst
          # The app alone, for its own updater: it downloads
          # releases/download/<tag>/omacharts-<arch>.gz, checks it against the
          # .sha256 beside it, and the package's launcher runs it from the
          # user's data folder in place of the installed app. Taken out of
          # the package rather than built again, so it is exactly the binary
          # pacman would install.
          command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }
          tar --zstd -xOf "$package" usr/lib/omacharts/omacharts | gzip -9n > omacharts-${{ matrix.arch }}.gz
          for asset in omacharts-${{ matrix.arch }}.gz omacharts-${{ matrix.arch }}.pkg.tar.zst; do
            sha256sum "$asset" > "$asset.sha256"
          done
          echo "package=$package" >> "$GITHUB_ENV"
      # The plain tarball, for x86_64 as it always was: the same app binary,
      # beside the licence, the README, the icons and the packaging files of
      # the tag's own source.
      - name: Assemble the tarball
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          dir="omacharts-$version-x86_64-linux"
          mkdir tag-source "$dir"
          tar xzf tag-source.tar.gz -C tag-source
          src="tag-source/omacharts-$version"
          tar --zstd -xOf "$package" usr/lib/omacharts/omacharts > "$dir/omacharts"
          chmod 755 "$dir/omacharts"
          bin/check-links "$dir/omacharts"
          cp "$src/LICENSE" "$src/README.md" "$dir/"
          cp -r "$src/assets" "$src/packaging" "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          echo "tarball=$dir.tar.gz" >> "$GITHUB_ENV"
      - name: Attach them to the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only x86_64 has a tarball.
          plain=()
          [ -z "${tarball:-}" ] || plain=("$tarball" "$tarball.sha256")
          gh release upload "$GITHUB_REF_NAME" \
            "$package" omacharts-${{ matrix.arch }}.pkg.tar.zst omacharts-${{ matrix.arch }}.pkg.tar.zst.sha256 \
            omacharts-${{ matrix.arch }}.gz omacharts-${{ matrix.arch }}.gz.sha256 \
            "${plain[@]}" --clobber
      - name: Keep what a release would have attached
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            omacharts-*.pkg.tar.zst
            omacharts-*.sha256
            omacharts-${{ matrix.arch }}.gz
            omacharts-*-x86_64-linux.tar.gz

  # Out of draft once every architecture's files are on it, and not before:
  # the updater finds a release through releases/latest, which skips drafts,
  # so nobody is offered a release they cannot download yet. A release whose
  # package job failed stays a draft, for a person to look at.
  publish:
    needs: [draft, sync, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
