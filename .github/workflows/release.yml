name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin omacharts
      - name: Name the archive after the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="omacharts-$version-x86_64-linux"
          mkdir "$dir"
          cp target/release/omacharts LICENSE README.md "$dir/"
          cp -r assets packaging "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            omacharts-*-x86_64-linux.tar.gz
            omacharts-*-x86_64-linux.tar.gz.sha256
          generate_release_notes: true

  # Everything a tag can carry is already in the tag: bin/release writes the
  # version into Cargo.toml, Cargo.lock, the README and the PKGBUILD, and
  # verifies the tree builds with it, before tagging. The one thing that cannot
  # exist until the tag does is the digest of the tarball GitHub builds for it,
  # so that is the only thing written here.
  #
  # Deliberately no toolchain and no cargo in this job. It used to bump the
  # version too, which meant running cargo in a checkout that never builds —
  # that left the lock file behind its own Cargo.toml once and broke every
  # --locked build on main, and failed outright the next time.
  sync:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Write the tarball's digest into the PKGBUILD
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          digest=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          [ -n "$digest" ] || { echo "no digest for $url"; exit 1; }

          # The tag should already name itself everywhere. If it does not,
          # something was tagged by hand instead of through bin/release.
          grep -q "^pkgver=${version}$" packaging/aur/PKGBUILD \
            || { echo "PKGBUILD pkgver is not ${version} — was this tagged with bin/release?"; exit 1; }

          sed -i -E "s|^sha256sums=.*|sha256sums=('${digest}')|" packaging/aur/PKGBUILD
          git diff --stat
      - name: Commit it back
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The digest was already correct."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Pin the ${GITHUB_REF_NAME} tarball

          Written by the release workflow: the digest of the tarball GitHub
          builds for a tag cannot be known until the tag exists."
          git push origin main

  # The package people actually install, built the way the PKGBUILD says and
  # attached to the release. After `sync`, so it uses the PKGBUILD carrying
  # this tag's version and digest — which also means a release that gets this
  # far has proved the PKGBUILD works against the tarball GitHub serves.
  #
  # Once per architecture, each on a runner of its own kind. Arch Linux itself
  # is x86_64 only; aarch64 machines — an Omarchy Mac among them — run Arch
  # Linux ARM, which publishes no container image, so its root filesystem is
  # imported from the project's own tarball instead.
  package:
    needs: sync
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: archlinuxarm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import Arch Linux ARM's root filesystem
        if: matrix.arch == 'aarch64'
        run: |
          set -euo pipefail
          base=http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          curl -fsSL "$base" -o rootfs.tar.gz
          curl -fsSL "$base.sig" -o rootfs.tar.gz.sig
          # The tarball only travels over plain HTTP — the host's certificate
          # does not cover it — so its signature is the one thing vouching for
          # it, and the keyring pacman goes on to trust is inside it.
          gpg --keyserver hkps://keyserver.ubuntu.com \
            --recv-keys 68B3537F39A313B3E574D06777193F152BDBE6A6
          gpg --verify rootfs.tar.gz.sig rootfs.tar.gz
          docker import rootfs.tar.gz archlinuxarm
      - name: Build the package
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" bash -euo pipefail -c '
            # A fresh root filesystem has no keys to check packages against,
            # and pacman cannot drop to its download user inside a container.
            pacman-key --init
            pacman-key --populate
            sed -i "s/^DownloadUser/#DownloadUser/" /etc/pacman.conf
            pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita
            # makepkg refuses to run as root, which is all a container has.
            useradd -m builder
            cp packaging/aur/PKGBUILD /home/builder/
            chown -R builder:builder /home/builder
            # Arch Linux ARM defaults to .pkg.tar.xz; one name for every arch.
            su builder -c "cd ~ && PKGEXT=.pkg.tar.zst makepkg --noconfirm"
            cp /home/builder/omacharts-*.pkg.tar.zst /w/'
          ls -l omacharts-*.pkg.tar.zst
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The debug package is a by-product nobody installs.
          gh release upload "$GITHUB_REF_NAME" \
            $(ls omacharts-*-${{ matrix.arch }}.pkg.tar.zst | grep -v -- '-debug-') --clobber
