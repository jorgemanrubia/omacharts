name: Pages

# Pages' built-in source can only serve the repository root or `/docs`, and
# the site is neither: it lives in `site/`, beside the rest of the project
# rather than on top of it. Publishing through Actions is what buys that
# choice, and it also buys the build: the manual is a Jekyll site on the
# just-the-docs theme, which Pages' own builder does not carry, so Jekyll
# runs here, from `site/Gemfile`, and what it writes to `site/_site` is
# what gets uploaded.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      # The sidebar shows the version, read from here at build time, so a
      # release redeploys the manual.
      - 'Cargo.toml'
      # Served at /data/listings.tsv for the app to fetch. The listings
      # workflow's own commits trigger nothing (a push made with
      # GITHUB_TOKEN never does), so it dispatches this itself; this path is
      # for a person's commit to the file.
      - 'crates/omacharts-engine/src/listings.tsv'
      - 'tools/check_listings.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push waits rather than cancelling the
# one in flight: a half-finished deploy is a site that is down.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The Ruby here is the one the site is developed against; the gems are
      # pinned by the lockfile and cached between runs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: site
      - uses: actions/configure-pages@v5
      - name: Build the site
        run: bundle exec jekyll build
        working-directory: site
        env:
          JEKYLL_ENV: production
      # The US listings the app fetches once a day: the compiled-in copy, so
      # there is one file and a release always ships what the site serves,
      # with a sidecar saying when it was built, how many rows it has and its
      # sha256. Added after Jekyll, so no page, menu, search index or feed
      # knows it is there. A file that fails the checks is left out and the
      # app keeps the copy it has.
      - name: Add the listings
        run: |
          mkdir -p site/_site/data
          if tools/check_listings.py crates/omacharts-engine/src/listings.tsv > site/_site/data/listings.json; then
            cp crates/omacharts-engine/src/listings.tsv site/_site/data/listings.tsv
            cat site/_site/data/listings.json
          else
            rm -f site/_site/data/listings.json
            echo "::warning::the compiled-in listings failed tools/check_listings.py; not published"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v4
