[package]
name = "omacharts"
version = "0.2.15"
edition = "2024"
# `src/bin/omacharts-launch.rs` is the second binary, the one the package
# installs as /usr/bin/omacharts; `cargo run` means the app.
default-run = "omacharts"
description = "Fast, beautiful charting software for Omarchy"
license = "MIT"

[workspace]
members = [".", "crates/omacharts-engine", "crates/omacharts-chart", "crates/tos-market", "crates/rithmic", "crates/sierra", "crates/dtc"]

[dependencies]
omacharts-engine = { path = "crates/omacharts-engine" }
# The chart itself: one chart drawn and handled, as a widget the window
# embeds, in a crate of its own so that it can be embedded elsewhere too.
omacharts-chart = { path = "crates/omacharts-chart" }
# A broker login's trading session, which the app keeps one of per login.
rithmic = { path = "crates/rithmic" }
# Sierra Chart's DTC server, a broker login's trading session too.
dtc = { path = "crates/dtc" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.4"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_10"] }
# A drawing's text is rich text — runs of bold and italic inside one label,
# over several lines — and cairo's own text API draws one font in one style
# in one line. Pango lays it out, pangocairo puts the result on the same
# context everything else on the chart is drawn with, and the bold range is
# an attribute rather than something measured and stitched by hand.
pangocairo = "0.22"
# Pulled in explicitly only to turn on `v2_80`, which is where
# GApplicationCommandLine learned to send a remote invocation's output
# back to the terminal that asked. The CLI is built on that.
gio = { version = "0.22", features = ["v2_80"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "wrap_help", "string"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Updates: asking GitHub for the newest release and downloading it, checking
# it against its published sha256, and unpacking it. All three are already in
# the tree for the feeds, so nothing new is compiled for them.
ureq = "3.4.2"
sha2 = "0.10.9"
flate2 = "1.1.10"

[features]
# The fake broker, `trading::fake`, outside the tests too.
fakes = []

[dev-dependencies]
# The fake feeds the tests prove the boundary with, never in a release.
omacharts-engine = { path = "crates/omacharts-engine", features = ["fakes"] }
# A DTC server in memory, for the Sierra Chart broker's tests.
dtc = { path = "crates/dtc", features = ["fake"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[build-dependencies]
