[package]
name = "omacharts"
version = "0.1.9"
edition = "2024"
description = "Fast, beautiful charting software for Omarchy"
license = "MIT"

[workspace]
members = [".", "crates/omacharts-engine"]

[dependencies]
omacharts-engine = { path = "crates/omacharts-engine" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.4"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_10"] }
# Pulled in explicitly only to turn on `v2_80`, which is where
# GApplicationCommandLine learned to send a remote invocation's output
# back to the terminal that asked. The CLI is built on that.
gio = { version = "0.22", features = ["v2_80"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "wrap_help", "string"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[build-dependencies]
