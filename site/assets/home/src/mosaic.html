<!doctype html>
<meta charset="utf-8">
<title>mosaic</title>
<link rel="stylesheet" href="base.css">
<style>
  .scene { perspective: 4200px; }
  .grid {
    position: absolute; left: 50%; top: 50%;
    width: 9800px; height: 6000px;
    transform-origin: 50% 50%;
    transform: translate(-50%, -50%) rotateX(46deg) rotateZ(-20deg) translateZ(-500px) scale(1.3);
    transform-style: preserve-3d;
  }
  .tile { width: 1180px; height: 664px; border-radius: 18px; }
</style>
<div class="scene"><div class="grid" id="grid"></div></div>
<div class="vignette"></div>
<script>
  // Nine columns by eight rows, more than the frame can hold; books and themes change tile to tile so no two
  // neighbours look alike. Row offsets stagger the columns like brickwork.
  const books = ["desk", "tape", "macro", "crypto", "swing"];
  const themes = ["tokyo-night", "gruvbox", "nord", "catppuccin", "everforest", "matte-black", "osaka-jade", "kanagawa", "ristretto", "lumon", "catppuccin-latte", "ethereal", "last-horizon", "solitude"];
  const W = 1180, H = 664, G = 54;
  const grid = document.getElementById("grid");
  let n = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = -1; c < 9; c++) {
      const img = new Image();
      const book = books[(n * 3 + r) % books.length];
      const theme = themes[(n * 5 + r * 2) % themes.length];
      img.className = "tile";
      img.src = `captures/${book}-${theme}.png`;
      img.style.left = (c * (W + G) + (r % 2 ? (W + G) / 2 : 0) + 200) + "px";
      img.style.top = (r * (H + G) + 60) + "px";
      grid.appendChild(img); n++;
    }
  }
</script>
