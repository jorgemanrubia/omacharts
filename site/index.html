<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omacharts — Beautiful charting software for Omarchy</title>
<meta name="description" content="Omacharts is a market-charting app for Omarchy. Everything the window can do, the omacharts command can do from a terminal.">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon.png" sizes="32x32" type="image/png">
<link rel="canonical" href="https://omacharts.org/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://omacharts.org/">
<meta property="og:title" content="Omacharts">
<meta property="og:description" content="Beautiful charting software for Omarchy.">
<meta property="og:image" content="https://omacharts.org/social.jpg?v=2">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&display=swap">

<style>
  /* Every colour is the app's own: Everforest's ground and foreground, and
     the amber it draws a trendline in. The page commits to the dark look
     deliberately — it is a picture of the application, and the application
     is dark here. */
  :root {
    --ground: #0d1114;
    --bright: #f3ecdc;
    --soft:   rgba(243, 236, 220, .92);
    --quiet:  rgba(243, 236, 220, .8);
    --amber:  #e2c285;
    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 5vw, 4rem);
    background-color: var(--ground);
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: var(--bright);
    font-family: var(--sans);
    text-align: center;
    /* A colour under the picture, so a slow or failed load is still the
       app's ground rather than white. */
  }

  /* The same scrim the cover uses, so the words read over candles rather
     than fighting them. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(58% 54% at 50% 48%,
      rgba(13, 17, 20, .93) 0%,
      rgba(13, 17, 20, .7) 48%,
      rgba(13, 17, 20, .26) 100%);
    pointer-events: none;
  }

  main {
    position: relative;
    display: grid;
    justify-items: center;
    gap: clamp(.45rem, 1.1vw, 1.3rem);
    max-width: 100%;
  }

  h1 {
    margin: 0;
    font-size: clamp(3rem, 11vw, 18rem);
    font-weight: 800;
    line-height: .86;
    letter-spacing: -.045em;
    color: var(--bright);
    text-shadow: 0 .02em .14em rgba(0, 0, 0, .6);
  }

  .tagline {
    margin: 0;
    font-size: clamp(1.05rem, 2.7vw, 4.3rem);
    font-weight: 500;
    line-height: 1.26;
    letter-spacing: .012em;
    color: var(--soft);
    text-wrap: balance;
    text-shadow: 0 .02em .1em rgba(0, 0, 0, .65);
  }

  /* Omarchy keeps the line's colour and takes an underline, so it reads as
     a link without breaking the sentence apart. */
  .tagline a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: rgba(243, 236, 220, .4);
    text-underline-offset: .14em;
    text-decoration-thickness: .045em;
    transition: text-decoration-color .18s ease, color .18s ease;
  }
  .tagline a:hover {
    color: var(--bright);
    text-decoration-color: var(--amber);
  }
  .tagline a:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* The install line is the one thing on the page a visitor is meant to take
     away, so it looks like what it is: a prompt, in the terminal's own
     letterforms. */
  .install {
    margin: clamp(1.6rem, 3.4vw, 4rem) 0 0;
    display: inline-flex;
    align-items: center;
    gap: .7em;
    padding: .62em 1.1em;
    border: 1px solid rgba(243, 236, 220, .18);
    border-radius: .55rem;
    background: rgba(13, 17, 20, .62);
    color: var(--soft);
    font-family: var(--mono);
    font-size: clamp(.82rem, 1.15vw, 1.4rem);
    line-height: 1;
    cursor: pointer;
    transition: border-color .18s ease, background-color .18s ease;
  }
  .install:hover,
  .install:focus-visible {
    border-color: rgba(226, 194, 133, .55);
    background: rgba(13, 17, 20, .78);
  }
  .install:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 4px;
  }
  .install .prompt {
    color: var(--amber);
    user-select: none;
  }
  .install code {
    font: inherit;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  /* Narrow enough and the command wraps rather than overflowing the phone. */
  @media (max-width: 26rem) {
    .install { gap: .5em; padding: .6em .8em; }
    .install code { white-space: normal; }
  }
  /* The hint is a glyph rather than a word: a clipboard that turns into a
     tick for a moment once the command is on it. Quiet until the line is
     pointed at, so it reads as an affordance, not a second label. */
  .install .hint {
    display: inline-flex;
    color: var(--bright);
    opacity: .4;
    transition: opacity .18s ease, color .18s ease;
  }
  .install .hint svg {
    width: .95em;
    height: .95em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .install:hover .hint,
  .install:focus-visible .hint { opacity: .7; }
  .install .done,
  .install[data-copied] .clip { display: none; }
  .install[data-copied] .done { display: block; }
  .install[data-copied] .hint { color: var(--amber); opacity: 1; }

  /* The repository is a mark in the corner rather than a second button in
     the hero: quiet like the clipboard glyph, brighter when pointed at, and
     a full finger's width to tap. */
  .repo {
    position: fixed;
    top: calc(clamp(.75rem, 2vw, 1.5rem) + env(safe-area-inset-top, 0px));
    right: calc(clamp(.75rem, 2vw, 1.5rem) + env(safe-area-inset-right, 0px));
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 999px;
    color: var(--bright);
  }
  .repo svg {
    width: 1.3rem;
    height: 1.3rem;
    fill: currentColor;
    opacity: .4;
    transition: opacity .18s ease;
  }
  .repo:hover svg,
  .repo:focus-visible svg { opacity: .7; }
  .repo:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tagline a { transition: none; }
    .install, .install .hint { transition: none; }
    .repo svg { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>Omacharts</h1>
    <p class="tagline">Beautiful charting software for <a href="https://omarchy.org">Omarchy</a></p>
    <button class="install" type="button" data-command="omarchy pkg add omacharts" title="Copy to clipboard">
      <span class="prompt" aria-hidden="true">$</span>
      <code>omarchy pkg add omacharts</code>
      <span class="hint" role="img" aria-label="Copy to clipboard">
        <svg class="clip" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        <svg class="done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
    </button>
  </main>
  <a class="repo" href="https://github.com/jorgemanrubia/omacharts" aria-label="Omacharts on GitHub" title="Omacharts on GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  <script>
    /* Progressive: with no clipboard and no script the command is still there
       to read and select, which is all it has to be. */
    const install = document.querySelector('.install');
    const hint = install.querySelector('.hint');
    install.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(install.dataset.command);
      } catch {
        return;
      }
      install.dataset.copied = '';
      hint.setAttribute('aria-label', 'Copied');
      setTimeout(() => {
        delete install.dataset.copied;
        hint.setAttribute('aria-label', 'Copy to clipboard');
      }, 1600);
    });
  </script>
</body>
</html>
