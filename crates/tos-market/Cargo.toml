[package]
name = "tos-market"
version = "0.1.0"
edition = "2021"
description = "Chart candles from thinkorswim."
license = "MIT"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The system's root certificates, as rithmic-rs uses: the same store a
# browser on this machine trusts.
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
