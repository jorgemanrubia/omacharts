[package]
name = "omacharts-engine"
version = "0.1.0"
edition = "2024"
description = "Market data, symbols and themes for omacharts. No GTK, no SQLite."
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
tos-market = { path = "../tos-market" }
