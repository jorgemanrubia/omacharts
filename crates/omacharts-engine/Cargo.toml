[package]
name = "omacharts-engine"
version = "0.1.0"
edition = "2024"
description = "Market data, symbols and themes for omacharts. No GTK, no SQLite."
license = "MIT"

[dependencies]
# Every indicator's arithmetic, one bar at a time. The functions in
# `indicators` are this folded over a series.
omacharts-studies = { path = "../omacharts-studies" }
# Prints, minute ladders and the folds between them.
omacharts-ticks = { path = "../omacharts-ticks" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.4"
async-channel = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Sierra Chart's data files: memory-mapped reads, no network.
sierra = { path = "../sierra" }
# The data feeds, and what only they need: HTTP, TLS, async runtimes.
ureq = { version = "3.4.2", features = ["json"], optional = true }
tos-market = { path = "../tos-market", optional = true }
rithmic = { path = "../rithmic", optional = true }
# Sierra Chart's DTC server, for what its files cannot say.
dtc = { path = "../dtc", optional = true }

[features]
default = ["feeds"]
# The data providers (`providers`). On for the app; off for a program that
# embeds the chart and brings its own bars, which then builds without any
# network stack.
feeds = ["dep:ureq", "dep:tos-market", "dep:rithmic", "dep:dtc"]
# The fake feeds that prove the boundary holds, for tests only: see
# src/providers/fake.rs.
fakes = ["feeds"]
